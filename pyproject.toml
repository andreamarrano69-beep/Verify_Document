[project]
name = "verify-document"
version = "0.2.0"
description = "Verifica locale di buste paga, Modello Redditi PF e documenti d'identità"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "pypdfium2>=4.0", "reportlab>=4.0"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=10"]
dnd = ["tkinterdnd2>=0.4"]

[project.scripts]
verify-document = "verify_document.cli:main"

[project.gui-scripts]
verify-document-gui = "verify_document.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["verify_document"]
